<!DOCTYPE html>
<html>
<head>
    <title>Student Registration form</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        form {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<form>
    <h2>Student Registration</h2>

    <input type="text" placeholder="Student Name" required>
    <input type="email" placeholder="Email" required>
    <input type="tel" placeholder="Phone Number" required>

    <select required>
        <option value="">Select Course</option>
        <option>B.Tech</option>
        <option>B.Sc</option>
        <option>B.Com</option>
        <option>BBA</option>
    </select>

    <input type="text" placeholder="College Name" required>

    <button type="submit">Register</button>
</form>

</body>
</html>
